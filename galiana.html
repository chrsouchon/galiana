<HTML><HEAD><TITLE>MICHEL  GALIANA  vous  accueille  ...</TITLE>
<META Name="author" content="Christian Souchon">
<META Name="description" content=" Textes et informations relatifs à l'oeuvre de Michel Galiana, Texts and Information to Michel Galiana's work">
<META Name="keywords" content="Michel Galiana, Michel Souchon, Christian Souchon, Poésie, Poetry, In Memoriam, D'un livre d'heures, Le songe du verger, Out of a Book of Hours, The Dream in the Orchard">
<META http-equiv=Content-Type content="text/html; charset=UTF-8">
</HEAD>
<BODY text=#ffffff bgColor=#000000>
<DIV id=splashcontainer style="WIDTH: 350px; POSITION: absolute"></DIV><LAYER 
id=splashcontainerns width="450"></LAYER>
<SCRIPT>
var preloadimages=new Array("hermesbn.jpg")
var intervals=4000
var targetdestination="entree.html"
var splashmessage=new Array()
var openingtags='<font face="Arial" size="4">'
splashmessage[0]='<img src="hermesbn.jpg"> MICHEL GALIANA'
splashmessage[1]='MICHEL GALIANA fut un poète de la solitude et du stoïcisme..... MICHEL GALIANA was a lonesome and stoical poet'
splashmessage[2]='Son oeuvre est un hymne vibrant à la BEAUTE ......His work has become a hymn to BEAUTY'
splashmessage[3]='Car peu m\'importe, à présent que la nuit monte, ......For I  don\'t care, now that darkness is coming down,'
splashmessage[4]='N\'avoir franchi ces portes où j\'ai heurté, ......... If the doors at which I had knocked denied entry'
splashmessage[5]='Si j\'ai connu, si l\'amertume surmonte, ......Since I could, even by bitterness outdone'
splashmessage[6]='Cette douceur qui s\'appelle éternité ....... Experience the soft bliss that\'s called eternity.'
var closingtags='</font>'
var i=0
var ns4=document.layers?1:0
var ie4=document.all?1:0
var ns6=document.getElementById&&!document.all?1:0
var theimages=new Array()
if (document.images){
for (p=0;p<preloadimages.length;p++){
theimages[p]=new Image()
theimages[p].src=preloadimages[p]
}
}
function displaysplash(){
if (i<splashmessage.length){
sc_cross.style.visibility="hidden"
sc_cross.innerHTML='<b><center>'+openingtags+splashmessage[i]+closingtags+'</center></b>'
sc_cross.style.left=ns6?parseInt(window.pageXOffset)+parseInt(window.innerWidth)/2-parseInt(sc_cross.style.width)/2 : document.body.scrollLeft+document.body.clientWidth/2-parseInt(sc_cross.style.width)/2
sc_cross.style.top=ns6?parseInt(window.pageYOffset)+parseInt(window.innerHeight)/2-sc_cross.offsetHeight/2 : document.body.scrollTop+document.body.clientHeight/2-sc_cross.offsetHeight/2
sc_cross.style.visibility="visible"
i++
}
else{
window.location=targetdestination
return
}
setTimeout("displaysplash()",intervals)
}

function displaysplash_ns(){
if (i<splashmessage.length){
sc_ns.visibility="hide"
sc_ns.document.write('<b>'+openingtags+splashmessage[i]+closingtags+'</b>')
sc_ns.document.close()

sc_ns.left=pageXOffset+window.innerWidth/2-sc_ns.document.width/2
sc_ns.top=pageYOffset+window.innerHeight/2-sc_ns.document.height/2

sc_ns.visibility="show"
i++
}
else{
window.location=targetdestination
return
}
setTimeout("displaysplash_ns()",intervals)
}



function positionsplashcontainer(){
if (ie4||ns6){
sc_cross=ns6?document.getElementById("splashcontainer"):document.all.splashcontainer
displaysplash()
}
else if (ns4){
sc_ns=document.splashcontainerns
sc_ns.visibility="show"
displaysplash_ns()
}
else
window.location=targetdestination
}
window.onload=positionsplashcontainer

</SCRIPT>
